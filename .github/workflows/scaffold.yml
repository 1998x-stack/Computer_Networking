name: Scaffold regression

on:
  push:
    branches: [main, "chore/**"]
  pull_request:
    paths:
      - "main.py"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/scaffold.yml"

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install documentation test dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Existing repository scaffold must be complete
        run: python main.py --check
