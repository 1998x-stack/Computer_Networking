name: Documentation consistency

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.py"
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements-docs.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned Markdown renderer
        run: python -m pip install -r requirements-docs.txt
      - name: Validate 212 chapter pairs and README scaffold
        run: python main.py --check
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify generated HTML is current and internal links resolve
        run: python scripts/build_docs.py --check
      - name: Prevent reintroduction of unsafe legacy HTML dependencies
        run: python scripts/migrate_html_security.py --check
      - name: Reader export regression
        run: node --test tests/test_markdown.cjs
