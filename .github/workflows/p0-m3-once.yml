name: One-time P0-M3 documentation render

on:
  push:
    branches:
      - feat/p0-m3-deterministic-docs
    paths:
      - ".github/workflows/p0-m3-once.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned renderer
        run: python -m pip install -r requirements-docs.txt
      - name: Render and audit complete site
        run: |
          python scripts/build_docs.py --write
          python scripts/build_docs.py --check
          python scripts/migrate_html_security.py --check
          python -m unittest discover -s tests -v
          count=$(git diff --name-only -- '*.html' | wc -l)
          echo "Updated HTML pages: $count"
          test "$count" -eq 214
      - name: Commit rendered HTML to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.html'
          git commit -m "docs(site): regenerate 214 pages deterministically from Markdown"
          git push origin HEAD:feat/p0-m3-deterministic-docs
