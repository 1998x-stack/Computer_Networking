name: One-time P1-M2 lesson HTML regeneration

on:
  push:
    branches:
      - docs/p1-m2-network-performance
    paths:
      - ".github/workflows/p1-m2-once.yml"

permissions:
  contents: write

jobs:
  update-performance-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install renderer
        run: python -m pip install -r requirements-docs.txt
      - name: Rebuild and verify four lessons
        run: |
          python scripts/build_docs.py --write
          python scripts/build_docs.py --check
          python scripts/migrate_html_security.py --check
          python -m unittest discover -s tests -v
          count=$(git diff --name-only -- '*.html' | wc -l)
          echo "Updated HTML pages: $count"
          test "$count" -eq 4
      - name: Commit regenerated pages to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.html'
          git commit -m "docs(p1-m2): regenerate four corrected performance pages"
          git push origin HEAD:docs/p1-m2-network-performance
